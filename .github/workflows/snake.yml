name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: pranav256
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=f8d847&color_dots[]=161b22,4d1540,9b2d7f,fe428e,f8d847
            dist/github-contribution-grid-snake-dark.svg?color_snake=f8d847&color_dots[]=0d1117,4d1540,9b2d7f,fe428e,f8d847
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
